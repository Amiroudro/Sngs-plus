name: Foundation checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API dependencies
        run: pip install -r backend/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q backend/app
      - name: Test published-edition reader
        run: python -m unittest discover -s backend/tests -v
      - name: Test SQLite study-layer migration
        run: python -m unittest discover -s database/tests -v

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Build website
        working-directory: frontend
        run: npm run build

  flutter-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get
      - name: Validate bundled edition data
        working-directory: app
        run: python3 tools/check_data.py
      - name: Analyze Flutter app
        working-directory: app
        run: flutter analyze
      - name: Run Flutter tests
        working-directory: app
        run: flutter test
      - name: Build unsigned-key fallback release APK
        working-directory: app
        run: flutter build apk --release
      - name: Upload release APK for inspection
        uses: actions/upload-artifact@v4
        with:
          name: sarangsho-plus-ci-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

  engine-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile engine modules
        working-directory: engine-v2
        run: python -m py_compile *.py
      - name: Load canonical rules and vocabulary
        working-directory: engine-v2
        run: |
          python rules_loader.py
          python -c "import json; json.load(open('rules/vocab_bank.json', encoding='utf-8'))"
      - name: Run offline policy, editorial, rights and publishing tests
        working-directory: engine-v2
        run: |
          python tests/test_collection_policy.py
          python tests/test_robots_policy.py
          python tests/test_source_routes.py
          python tests/test_rights_registry.py
          python tests/test_rights_sync.py
          python tests/test_exam_learning_sidecar.py
          python tests/test_step2.py
          python tests/test_step3.py
          python tests/test_translation_approval_gate.py
          python tests/test_publish_v2.py
          python tests/test_run_v2_daily.py
          python tests/test_step10.py
